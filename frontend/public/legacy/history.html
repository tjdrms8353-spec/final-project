<main class="app-main"><div class="page-heading"><div><div class="eyebrow">Document Archive · 02</div><h1>데이터 이력</h1><div class="subtitle">처리된 문서와 거래처별 비용 흐름을 검색하고 확인합니다.</div></div><a href="upload.html" class="btn btn-brand"><i class="bi bi-plus-lg me-2"></i>문서 추가</a></div><section class="panel mb-4"><div class="row g-2 align-items-end"><div class="col-md-3"><label class="form-label small fw-semibold">기간 시작</label><input id="fromDate" class="form-control" type="date" value="2026-11-01"></div><div class="col-md-3"><label class="form-label small fw-semibold">기간 종료</label><input id="toDate" class="form-control" type="date" value="2026-11-16"></div><div class="col-md-2"><label class="form-label small fw-semibold">문서 유형</label><select id="typeFilter" class="form-select"><option value="">전체 유형</option><option value="receipt">영수증</option><option value="email">이메일</option></select></div><div class="col-md-2"><label class="form-label small fw-semibold">처리 상태</label><select id="statusFilter" class="form-select"><option value="">전체 상태</option><option value="succeeded">성공</option><option value="review">검토 대기</option><option value="failed">실패</option></select></div><div class="col-md-2"><button id="filterBtn" class="btn btn-brand w-100"><i class="bi bi-search me-2"></i>검색</button></div><div class="col-12 mt-3"><input id="vendorSearch" class="form-control" placeholder="거래처 또는 문서 번호 검색"></div></div></section><section class="panel mb-4"><div class="d-flex justify-content-between mb-2"><div><div class="panel-title">처리 문서 <span class="text-muted fw-normal" id="resultCount"></span></div><div class="panel-subtitle">행을 선택하면 문서 상세 정보가 표시됩니다.</div></div><button class="btn btn-outline-secondary btn-sm rounded-3" data-toast="내보내기 API를 연결해 주세요."><i class="bi bi-download me-1"></i>CSV 내보내기</button></div><div class="table-responsive"><table class="table"><thead><tr><th>문서 번호</th><th>거래처</th><th>품목</th><th>공급가액</th><th>부가세</th><th>상태</th><th>처리일</th></tr></thead><tbody id="historyRows"></tbody></table></div></section><section class="panel"><div class="d-flex justify-content-between"><div><div class="panel-title">월별 거래처 비용 추이</div><div class="panel-subtitle">거래처별 비용 집계 · 최근 6개월</div></div><select class="form-select" style="width:auto"><option>전체 거래처</option><option>카페 모노</option><option>오피스플러스</option></select></div><div id="vendorChart" class="chart"></div></section></main>
