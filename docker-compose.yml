services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      APP_NAME: ${APP_NAME:-Final Project API}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5175","http://127.0.0.1:5175"]}'
      TIDB_HOST: ${TIDB_HOST:-}
      TIDB_PORT: ${TIDB_PORT:-4000}
      TIDB_USER: ${TIDB_USER:-}
      TIDB_PASSWORD: ${TIDB_PASSWORD:-}
      TIDB_DATABASE: ${TIDB_DATABASE:-}
      TIDB_SSL_CA: ${TIDB_SSL_CA:-}
