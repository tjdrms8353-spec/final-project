# dayribbon CI — 백엔드 테스트 + 프론트엔드 빌드 검증
# develop·final-pj에 push되거나 PR이 열리면 실행된다.
name: CI

on:
  push:
    branches: [develop, final-pj]
  pull_request:
    branches: [develop, final-pj, main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 의존성 설치
        run: pip install -r backend/requirements.txt
      - name: pytest
        run: python -m pytest tests -q
        working-directory: backend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 의존성 설치
        run: npm ci
        working-directory: frontend
      - name: 빌드
        run: npm run build
        working-directory: frontend
